<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Dimm — Linux Enthusiast</title>
  <desc id="desc">Minimalist header for Dimm, a Linux enthusiast focused on open source, software, and offensive security.</desc>
  <style>
    .hero-title {
      fill: #24292f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -2px;
    }
    .hero-subtitle {
      fill: #57606a;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 22px;
    }
    .hero-accent {
      fill: #e01922;
    }
    @media (prefers-color-scheme: dark) {
      .hero-title {
        fill: #e6edf3;
      }
      .hero-subtitle {
        fill: #8b949e;
      }
    }
  </style>

  <g transform="translate(0, 100)">
    <text class="hero-title" x="0" y="0">Dimm</text>
    <text class="hero-subtitle" x="0" y="48">Linux Enthusiast • Open Source Enjoyer • Offsec Learner</text>
    <rect class="hero-accent" x="0" y="72" width="40" height="4" />
  </g>
</svg>
