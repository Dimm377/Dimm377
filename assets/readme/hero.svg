<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Dimm — Linux Enthusiast</title>
  <desc id="desc">Minimalist header for Dimm, a Linux enthusiast focused on open source, software, and offensive security.</desc>

  <!-- Stable background for GIF rendering -->
  <rect width="1200" height="200" fill="#0D1117" />

  <g transform="translate(0, 100)">
    <text id="hero-title" x="0" y="0" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="900" letter-spacing="-2">Dimm</text>
    <text id="hero-subtitle" x="0" y="48" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">Linux Enthusiast • Open Source • Software • Offensive Security</text>
    <rect id="hero-accent" x="0" y="72" width="40" height="4" fill="#E01922" />
  </g>
</svg>
